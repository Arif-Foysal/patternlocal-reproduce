    xai_tris_rigid_white: mdariffaysalnayem/xai-tris-rigid-white
    xai_tris_results: ''
    full_results: ''
pipeline:
  phases:
    phase1:
      description: XOR suppressor toy problem (smoke test)
      notebooks:
      - id: xor_toy
        gpu: false
        datasets: []
        success_criteria:
        - patternlocal_suppressor < 0.1 * lime_suppressor
    phase2_lin_corr:
      description: XAI-TRIS LIN CORR data generation
      notebooks:
      - id: xai_tris_lin_corr
        gpu: false
        datasets: []
        success_criteria:
        - all 9 alphas complete
        - test accuracy > 90%
    phase2_lin_white:
      description: XAI-TRIS LIN WHITE data generation
      notebooks:
      - id: xai_tris_lin_white
        gpu: false
        datasets: []
        success_criteria:
        - all 9 alphas complete
        - test accuracy > 90%
    phase2_xor_corr:
