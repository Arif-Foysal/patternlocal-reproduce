project:
  slug: patternlocal-repro
kaggle:
  username: mdariffaysalnayem
  datasets:
    core: mdariffaysalnayem/patternlocal-repro-core
    xai_tris_xor_corr: mdariffaysalnayem/xai-tris-xor-corr
    xai_tris_lin_corr: mdariffaysalnayem/xai-tris-lin-corr
    xai_tris_rigid_corr: mdariffaysalnayem/patternlocal-repro-phase2-clark-rigid-corr
    xai_tris_xor_white: mdariffaysalnayem/patternlocal-repro-phase2-clark-xor-white
